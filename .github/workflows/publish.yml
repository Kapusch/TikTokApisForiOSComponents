name: publish

on:
  workflow_dispatch:
    inputs:
      manual_version:
        description: "Publish this version to NuGet.org; leave empty for a GitHub Packages preview"
        required: false
        type: string
      package:
        description: "Package to build: share (Kapusch.TikTok.iOS) or business (Kapusch.TikTok.Business.iOS)"
        required: false
        default: share
        type: choice
        options:
          - share
          - business
  push:
    tags:
      # vX.Y.Z[-rc.N] releases the Share package; business-vX.Y.Z[-rc.N] releases the Business package.
      # Tag filters match the whole tag name, so "v*" never matches "business-v*".
      - "v*"
      - "business-v*"

permissions:
  contents: read
  packages: write

jobs:
  pack_and_publish:
    runs-on: macos-15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine package and version
        id: version
        shell: bash
        run: |
          REF="${{ github.ref }}"
          MANUAL_VERSION="${{ github.event.inputs.manual_version }}"
          PACKAGE="${{ github.event.inputs.package }}"

          if [[ "$REF" =~ ^refs/tags/business-v ]]; then
            PACKAGE="business"
          elif [[ "$REF" =~ ^refs/tags/v ]]; then
            PACKAGE="share"
          fi
          PACKAGE="${PACKAGE:-share}"

          case "$PACKAGE" in
            share)
              PACKAGE_ID="Kapusch.TikTok.iOS"
              CSPROJ="src/Kapusch.TikTokApisForiOSComponents/Kapusch.TikTokApisForiOSComponents.csproj"
              NATIVE_BUILD="src/Kapusch.TikTokApisForiOSComponents/Native/iOS/build.sh"
              VALIDATOR="scripts/validate-package.sh"
              ;;
            business)
              PACKAGE_ID="Kapusch.TikTok.Business.iOS"
              CSPROJ="src/Kapusch.TikTok.Business.iOS/Kapusch.TikTok.Business.iOS.csproj"
              NATIVE_BUILD="src/Kapusch.TikTok.Business.iOS/Native/iOS/build.sh"
              VALIDATOR="scripts/validate-business-package.sh"
              ;;
            *)
              echo "ERROR: unknown package '$PACKAGE'."
              exit 1
              ;;
          esac
          BASE_VERSION=$(grep -oE '<Version>[^<]+' "$CSPROJ" | head -n 1 | sed 's/<Version>//')

          if [[ -n "$MANUAL_VERSION" ]]; then
            VERSION="$MANUAL_VERSION"
            PUBLISH_TARGET="nuget"
          elif [[ "$REF" =~ ^refs/tags/business-v ]]; then
            TAG="${REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^business-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "ERROR: Business release tags must be business-vX.Y.Z or business-vX.Y.Z-rc.N."
              exit 1
            fi
            VERSION="${TAG#business-v}"
            PUBLISH_TARGET="nuget"
          elif [[ "$REF" =~ ^refs/tags/v ]]; then
            VERSION="${REF#refs/tags/v}"
            PUBLISH_TARGET="nuget"
          else
            VERSION="${BASE_VERSION}-preview.${{ github.run_number }}.$(git rev-parse --short HEAD)"
            PUBLISH_TARGET="github"
          fi

          if [[ "$PUBLISH_TARGET" == "nuget" ]]; then
            git fetch origin master
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/master; then
              echo "ERROR: NuGet.org releases must be reachable from origin/master."
              exit 1
            fi
          fi

          echo "Package: $PACKAGE_ID $VERSION -> $PUBLISH_TARGET"
          echo "package_id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"
          echo "csproj=$CSPROJ" >> "$GITHUB_OUTPUT"
          echo "native_build=$NATIVE_BUILD" >> "$GITHUB_OUTPUT"
          echo "validator=$VALIDATOR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_target=$PUBLISH_TARGET" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26.3
        # Pinned: the native artifacts must stay consumable by Xcode 26.3 toolchains.
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.203"

      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.203

      - name: Build pinned native wrapper
        run: bash "${{ steps.version.outputs.native_build }}"

      - name: Pack
        run: |
          dotnet pack "${{ steps.version.outputs.csproj }}" \
            -c Release \
            -o artifacts/nuget \
            /p:PackageVersion="${{ steps.version.outputs.version }}"

      - name: Validate package
        run: ${{ steps.version.outputs.validator }} "artifacts/nuget/${{ steps.version.outputs.package_id }}.${{ steps.version.outputs.version }}.nupkg"

      - name: Push to NuGet.org
        if: steps.version.outputs.publish_target == 'nuget'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: steps.version.outputs.publish_target == 'nuget'
        run: |
          dotnet nuget push artifacts/nuget/*.nupkg \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Push to GitHub Packages
        if: steps.version.outputs.publish_target == 'github'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push artifacts/nuget/*.nupkg \
            --api-key "$NUGET_AUTH_TOKEN" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
