name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_pack_ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        # Pinned: the native artifacts must stay consumable by Xcode 26.3 toolchains.
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.203"
      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.203
      - name: Build pinned Core + Share wrapper
        run: bash src/Kapusch.TikTokApisForiOSComponents/Native/iOS/build.sh
      - name: Pack
        run: dotnet pack src/Kapusch.TikTokApisForiOSComponents/Kapusch.TikTokApisForiOSComponents.csproj -c Release -o artifacts/nuget
      - name: Validate package
        run: scripts/validate-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget/*.nupkg


  build_pack_business_ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        # Pinned: the static archive contains Swift objects that must stay linkable by Xcode 26.3 toolchains.
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.203"
      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.203
      - name: Build pinned TikTok Business SDK wrapper
        run: bash src/Kapusch.TikTok.Business.iOS/Native/iOS/build.sh
      - name: Build Share wrapper for the collision check
        run: bash src/Kapusch.TikTokApisForiOSComponents/Native/iOS/build.sh
      - name: Check Share and Business native symbol collisions
        run: scripts/check-native-symbol-collisions.sh
      - name: Pack
        run: dotnet pack src/Kapusch.TikTok.Business.iOS/Kapusch.TikTok.Business.iOS.csproj -c Release -o artifacts/nuget
      - name: Validate package
        run: scripts/validate-business-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-business
          path: artifacts/nuget/*.nupkg

  public_tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for private identifiers and credentials
        env:
          # Optional deny patterns kept outside the public tree; the scan skips them when unset.
          VERIFY_PUBLIC_EXTRA_PATTERNS: ${{ secrets.VERIFY_PUBLIC_EXTRA_PATTERNS }}
        run: python3 -I scripts/verify-public.py
